# Local environment in containers: PostgreSQL + pgAdmin + migrations + API.
#
#   npm run docker:up     -> build and start everything
#   npm run docker:down   -> stop everything (data is kept in the pgdata volume)
#
# Ports (chosen so they don't clash with your locally installed Postgres):
#   API       http://localhost:4000      (stop `npm run dev` first, it uses the same port)
#   Postgres  localhost:5433             user: inventory / password: inventory
#   pgAdmin   http://localhost:5050      admin@example.com / admin

name: inventory

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory_dev
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      # Runs once on first start: creates the extra test/qa databases.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inventory -d inventory_dev']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '5050:80'
    depends_on:
      - postgres
    restart: unless-stopped

  # One-off job: applies Prisma migrations, then exits. The API waits for it.
  migrate:
    build:
      context: .
      target: build
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://inventory:inventory@postgres:5432/inventory_dev?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      target: runtime
    environment:
      # The image runs in production mode; these values make it convenient locally.
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://inventory:inventory@postgres:5432/inventory_dev?schema=public
      LOG_LEVEL: info
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      SWAGGER_ENABLED: 'true'
      RATE_LIMIT_MAX: 1000
    ports:
      - '4000:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
